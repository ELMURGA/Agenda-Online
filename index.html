<style>

</style></head><body>
<div id="bgs"></div>
<div id="top">
  <div id="clk" class="top-pill" title="Hora actual">--:--</div>

</div>

<div id="wtm"><div id="wtmc"></div></div>
<canvas id="cf"></canvas>
<div id="lg"><div><h2>Calendario 26/27</h2><p>Escribe tu clave secreta. Si usas la misma en todos tus dispositivos, verás siempre lo mismo.</p><input id="lgi" type="password" autocomplete="current-password" placeholder="Tu clave" enterkeyhint="go"><div id="lge"></div><button id="lgb">Entrar</button><a id="lgs">Usar sin sincronizar</a></div></div>
<script>
const TH=[['sep','Septiembre','#780000',2026,8,'#ec9f97'],['oct','Octubre','#5f4d40',2026,9,'#6f5f54'],['nov','Noviembre','#55595a',2026,10,'#b7bcbc'],['dic','Diciembre','#444830',2026,11,'#7d7a5c'],['ene','Enero','#1e3a6b',2027,0,'#88a0c4'],['feb','Febrero','#8b4a2b',2027,1,'#d9c6b2'],['mar','Marzo','#4b5238',2027,2,'#a4ae96'],['abr','Abril','#d0581a',2027,3,'#e4905f'],['may','Mayo','#a88422',2027,4,'#e2cf8f'],['jun','Junio','#d0708c',2027,5,'#f2c0cf'],['jul','Julio','#2f6b6a',2027,6,'#5fbfb0'],['ago','Agosto','#7a3fb0',2027,7,'#c0a4d8']],
K={examen:['Examen','#f4c4bd','#d8736a'],entrega:['Entrega','#e3d6c9','#b59a82'],cumple:['Cumple','#f3d3dc','#e08aa5'],tarea:['Tarea','#d5dbc8','#7d9168'],otro:['Otro','#cfd8e6','#7b93b8']},
MN={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,set:8,oct:9,nov:10,dic:11};
const p2=n=>String(n).padStart(2,'0'),iso=(y,m,d)=>y+'-'+p2(m+1)+'-'+p2(d),dd=s=>new Date(s+'T00:00'),isoD=d=>iso(d.getFullYear(),d.getMonth(),d.getDate()),
 addD=(s,n)=>{const d=dd(s);d.setDate(d.getDate()+n);return isoD(d)},tdy=()=>isoD(new Date()),dl=s=>Math.round((dd(s)-dd(tdy()))/864e5),
 fd=s=>dd(s).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}),fdl=s=>dd(s).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}),
 esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),when=n=>n==0?'hoy':n==1?'mañana':'en '+n+' días';
let S={},T={};try{const o=JSON.parse(localStorage.getItem('cal2627')||'{}');S=o.S||{};T=o.T||{}}catch(e){}
const save=()=>{try{localStorage.setItem('cal2627',JSON.stringify({S,T}))}catch(e){}};
const items=()=>Object.keys(S).filter(k=>k[0]=='e').map(k=>{try{return JSON.parse(S[k])}catch(e){return null}}).filter(Boolean),find=id=>items().find(i=>i.id==id);
function put(it){const k='e'+it.id;S[k]=JSON.stringify(it);T[k]=Date.now();save();queue();render()}
function del(id){const k='e'+id;delete S[k];T[k]=Date.now();save();queue();render()}
const row=i=>{const k=K[i.k]||K.otro;return `<div class="it${i.x?' dn':''}"><button class="ck" data-a="ck" data-id="${i.id}">${i.x?'✓':''}</button><div class="tx" data-a="goto" data-d="${i.d}"><b>${esc(i.t)}</b><small>${fd(i.d)}${i.h?' · '+i.h:''}</small></div><span class="tg" data-a="goto" data-d="${i.d}" style="background:${k[1]}">${k[0]}</span><button class="rm" data-a="x" data-id="${i.id}">×</button></div>`},
 byD=(a,b)=>(a.d+(a.h||'')<b.d+(b.h||''))?-1:1;

let twDone=false,twTimer=null;
function runTypewriter(target){
  const el=document.getElementById('twTxt'),cur=document.querySelector('.tw-cur');
  if(!el)return;
  if(twDone){el.textContent=target;if(cur)cur.style.display='none';return;}
  clearTimeout(twTimer);
  el.textContent='';
  let i=0;
  function step(){
    if(i<target.length){
      el.textContent+=target[i++];
      twTimer=setTimeout(step,60+Math.random()*25);
    } else {
      twDone=true;
      setTimeout(()=>{
        if(cur){
          cur.style.transition='opacity .6s';
          cur.style.opacity='0';
          setTimeout(()=>{if(cur)cur.style.display='none'},600);
        }
      },1500);
    }
  }
  step();
}

function hoyH(L){
  const td=tdy(),mine=L.filter(i=>i.d==td).sort(byD),n=mine.filter(i=>i.x).length,p=mine.length?n/mine.length:0,h=new Date().getHours(),
  g=(h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches')+' Rocío',
  up=L.filter(i=>i.d>td&&!i.x).sort(byD).slice(0,3);
  return `<section><div class="card"><div class="gr"><span id="twTxt">${twDone?esc(g):''}</span><span class="tw-cur" style="${twDone?'display:none':''}">|</span></div><div class="dt">${fdl(td)}</div><div class="rg"><div class="ring"><svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="36" fill="none" stroke="#e8d6cf" stroke-width="9"/><circle cx="44" cy="44" r="36" fill="none" stroke="#b5574d" stroke-width="9" stroke-linecap="round" stroke-dasharray="${p*226} 226" transform="rotate(-90 44 44)" style="transition:stroke-dasharray .6s"/></svg><span>${Math.round(p*100)}%</span></div><div><b>${mine.length?n+' de '+mine.length+' tareas':'Día libre'}</b><small>${mine.length&&p==1?'¡Todo hecho! 🎉':mine.length?(n?'Vas bien, sigue así':'¡A por ello!'):'Nada apuntado para hoy'}</small></div></div></div>
  <div class="card"><h3>Hoy</h3>${mine.length?mine.map(row).join(''):'<p class="em">Nada apuntado todavía ✨</p>'}<button class="add" data-a="day" data-d="${td}">+ Añadir</button></div>
  ${up.length?`<div class="chips">${up.map(i=>`<div class="chip" data-a="goto" data-d="${i.d}" style="background:${(K[i.k]||K.otro)[1]}"><small>${(K[i.k]||K.otro)[0].toUpperCase()}</small><b>${esc(i.t.length>12?i.t.slice(0,11)+'…':i.t)}</b><span>${fd(i.d)} · ${when(dl(i.d))}</span></div>`).join('')}</div>`:''}
  <p class="hint">Desliza para viajar por el año<br>↓</p></section>`;
}
function monH(t,L){const [k,nm,dk,y,m]=t,pre=y+'-'+p2(m+1),f=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),td=tdy(),mine=L.filter(i=>i.d.startsWith(pre)).sort(byD);let c='<b>L</b><b>M</b><b>X</b><b>J</b><b>V</b><b>S</b><b>D</b>'+'<span></span>'.repeat(f);
 for(let d=1;d<=nd;d++){const s=iso(y,m,d),ks=[...new Set(L.filter(i=>i.d==s).map(i=>i.k))].slice(0,3);c+=`<button class="d${s==td?' t':''}" style="--c:${dk}" data-a="day" data-d="${s}">${d}${ks.length?'<i>'+ks.map(x=>`<s style="background:${(K[x]||K.otro)[2]}"></s>`).join('')+'</i>':''}</button>`}
 return `<section><div class="pill" style="color:${dk}"><h2>${nm}</h2><small>curso 26/27</small></div><div class="card"><div class="g">${c}</div></div><div class="card"><h3>Este mes</h3>${mine.length?mine.map(row).join(''):'<p class="em">Nada apuntado todavía</p>'}</div></section>`}
const cur=0,show=()=>render(),root=document.getElementById('root'),bgs=document.getElementById('bgs'),rail=document.getElementById('rail');
bgs.innerHTML=TH.map(t=>`<div class="bg" style="background-image:url(assets/${t[0]}.jpg)"></div>`).join('');
rail.innerHTML=TH.map((t,j)=>`<button data-j="${j}" aria-label="${t[1]}"><i style="background:${t[5]}"></i></button>`).join('');
function render(){
  const L=items();root.innerHTML=hoyH(L)+TH.map(t=>monH(t,L)).join('');fx();
  const h=new Date().getHours();
  const g=(h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches')+' Rocío';
  runTypewriter(g);
  if(sh.classList.contains('on'))shRender();

function fx(){const vh=innerHeight,td=tdy(),tm=Math.max(0,TH.findIndex(t=>td.startsWith(t[3]+'-'+p2(t[4]+1)))),bw=Array(12).fill(0);

async function fetchWeather(lat,lon,locName){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);
    if(!r.ok)throw new Error('err');
    const data=await r.json();
    weatherCache={data,locName,ts:Date.now()};
    try{localStorage.setItem('cal2627_weather',JSON.stringify(weatherCache))}catch(e){}
    updateWeatherUI(data,locName);
  }catch(e){
    if(weatherCache&&weatherCache.data)updateWeatherUI(weatherCache.data,weatherCache.locName);
  }
}

let KEY=localStorage.getItem('cal2627key')||'',SKIP=localStorage.getItem('cal2627skip')=='1',pushT=null,busy=false,state='off',late=false;
const cl=document.getElementById('cl'),lg=document.getElementById('lg'),lgi=document.getElementById('lgi'),lge=document.getElementById('lge');

async function sha(t){t=t.trim().toLowerCase();if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cal2627|'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 let o='';for(let s=0;s<4;s++){let a=0xdeadbeef^s,b=0x41c6ce57^s;for(const c of t){const n=c.charCodeAt(0);a=Math.imul(a^n,2654435761);b=Math.imul(b^n,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);o+=(b>>>0).toString(16).padStart(8,'0')+(a>>>0).toString(16).padStart(8,'0')}return o}
async function api(m,b){const r=await fetch('/api/sync',{method:m,headers:{'content-type':'application/json','x-key':KEY},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
function merge(R){let ch=false,push=false;const RT=R.T||{},RS=R.S||{};for(const k of new Set([...Object.keys(T),...Object.keys(RT)])){const rt=RT[k]||0,lt=T[k]||0;if(rt>lt){T[k]=rt;if(k in RS)S[k]=RS[k];else delete S[k];ch=true}else if(lt>rt)push=true}return{ch,push}}
function refresh(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)){late=true;return}show(cur)}
addEventListener('focusout',()=>{if(late)setTimeout(()=>{const a=document.activeElement;if(!a||!/INPUT|TEXTAREA/.test(a.tagName)){late=false;show(cur)}},80)});

async function pull(){if(!KEY||busy||pushT)return;busy=true;try{const R=await api('GET');const m=merge(R.data||{});save();if(m.ch)refresh();setState(m.push?'sync':'ok');busy=false;if(m.push)push()}catch(e){busy=false;if(e.message=='401')setState('err');else setState('err')}}

function b64u8(s){const p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(b),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a}
let PUSH_ON=localStorage.getItem('cal2627push')=='1';
const pushBtn=document.getElementById('pushBtn');
function setPushUI(){if(!pushBtn)return;pushBtn.classList.toggle('on',PUSH_ON);pushBtn.title=PUSH_ON?'Recordatorios activados (toca para desactivar)':'Activar recordatorios'}

async function subscribePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){alert('Tu navegador no soporta notificaciones push.');return}
  if(!KEY){lg.classList.add('on');lgi.focus();return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return;
    const reg=await navigator.serviceWorker.ready;
    const {publicKey}=await fetch('/api/vapid-public-key').then(r=>r.json());
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(publicKey)});
    const j=sub.toJSON();
    await fetch('/api/push-subscribe',{method:'POST',headers:{'content-type':'application/json','x-key':KEY},body:JSON.stringify({endpoint:j.endpoint,keys:j.keys})});
    PUSH_ON=true;localStorage.setItem('cal2627push','1');setPushUI();
  }catch(e){alert('No se pudieron activar los recordatorios.')}
}
async function unsubscribePush(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){
      await fetch('/api/push-subscribe',{method:'DELETE',headers:{'content-type':'application/json','x-key':KEY},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});
      await sub.unsubscribe();
    }
  }catch(e){}
  PUSH_ON=false;localStorage.setItem('cal2627push','0');setPushUI();
}
if(pushBtn)pushBtn.onclick=()=>PUSH_ON?unsubscribePush():subscribePush();
